services:
  dbt:
    image: dbt:dev
    build:
      context: .
      dockerfile: Dockerfile
# uncomment this line to use your github_token in local
#    env_file:
#      - .env
    environment:
      GIT_TOKEN: $GITHUB_TOKEN
      GIT_REPO: "user_name/MY_REPO.git"
      DUCKDB_PATH: /data/dbt.duckdb
    volumes:
      # Source code
      - ./src/profiles.yml:/opt/program/profiles.yml
      - ./entrypoint.sh:/entrypoint.sh
      # DuckDB database file, shared with the duckdb service
      - duckdb-data:/data

    command: [ "bash", "-c" ,"dbt run --profiles-dir . && echo finish" ]

  # DuckDB CLI on the same database file, to inspect what dbt built.
  # DuckDB allows a single writer: run it once dbt has finished.
  #   docker compose run --rm duckdb
  duckdb:
    image: duckdb/duckdb:2.0.1
    profiles: [ "tools" ]
    command: [ "/duckdb", "/data/dbt.duckdb" ]
    stdin_open: true
    tty: true
    volumes:
      - duckdb-data:/data

volumes:
  duckdb-data:
